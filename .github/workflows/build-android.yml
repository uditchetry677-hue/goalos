name: Build GoalOS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          test -n "$ZIP_FILE" || {
            echo "No project ZIP found in repository root."
            exit 1
          }
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Generate Gradle wrapper if missing
        shell: bash
        run: |
          set -e
          cd extracted
          if [ ! -f gradlew ]; then
            VERSION=$(sed -n \
              's/.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*/\1/p' \
              gradle/wrapper/gradle-wrapper.properties | head -n 1)
            if [ -z "$VERSION" ]; then
              echo "Cannot determine Gradle version from wrapper properties."
              cat gradle/wrapper/gradle-wrapper.properties
              exit 1
            fi
            gradle wrapper --gradle-version "$VERSION"
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: |
          cd extracted
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoalOS-Android-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
