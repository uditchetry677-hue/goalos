      - name: Find and extract project ZIP
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted
          echo "=== Extracted file structure ==="
          find extracted -maxdepth 5 -type f | head -200
          echo "=== Searching for project manifests ==="
          find extracted -type f \( \
            -name package.json -o \
            -name settings.gradle -o \
            -name settings.gradle.kts -o \
            -name AndroidManifest.xml \
          \) -print
          
