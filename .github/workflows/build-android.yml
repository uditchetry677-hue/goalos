name: Build GoalOS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found in repository root."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          if [ ! -f extracted/settings.gradle.kts ] && \
             [ ! -f extracted/settings.gradle ]; then
            echo "ERROR: Gradle settings file not found."
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e
          cd extracted

          if [ ! -f gradlew ]; then
            VERSION=$(sed -n \
              's/.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*/\1/p' \
              gradle/wrapper/gradle-wrapper.properties | head -n 1)

            if [ -z "$VERSION" ]; then
              echo "ERROR: Cannot determine Gradle version."
              exit 1
            fi

            gradle wrapper --gradle-version "$VERSION"
          fi

          chmod +x gradlew

      - name: Prepare debug signing
        shell: bash
        run: |
          set -e
          cd extracted

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        shell: bash
        run: |
          cd extracted
          ./gradlew --no-daemon assembleDebug

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e
          APK=$(find extracted -type f \
            -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Build finished without a debug APK."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK created: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalOS-Android-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          
